# Backend is internal-only; the frontend reaches it via
# http://youtubeliveapp.youtube-live.svc.cluster.local/backend/...
apiVersion: v1
kind: Service
metadata:
  name: youtubeliveapp
  namespace: youtube-live
  labels:
    app.kubernetes.io/name: youtubeliveapp
    app.kubernetes.io/instance: youtubeliveapp-prod
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: youtube-live-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: youtubeliveapp
    app.kubernetes.io/instance: youtubeliveapp-prod
    app.kubernetes.io/component: api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
